app:
  media:
    # Cached test contexts share one DB but use different roots or mocked storage.
    # Tests invoke cleanup explicitly; avoid another context draining their queue.
    cleanup-interval-ms: 3600000
  kakao:
    app-id: 1453687
  account-deletion:
    kakao-admin-key: test-only-primary-admin-key
    webhook-scheduler-enabled: true
    webhook-interval-ms: 3600000
  jwt:
    secret: test-only-jwt-secret-for-automated-tests
