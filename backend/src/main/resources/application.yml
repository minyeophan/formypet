server:
  port: ${SERVER_PORT:8083}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
      file-size-threshold: 0B
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:.env.support[.properties]
  application:
    name: formypet

  jackson:
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/formypet?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      connection-init-sql: "SET time_zone = '+00:00'"
      data-source-properties:
        connectionTimeZone: UTC

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  kakao:
    app-id: ${KAKAO_APP_ID:}
  request-limits:
    login-account-capacity: 10
    login-account-refill-seconds: 30
    login-client-capacity: 60
    login-client-refill-seconds: 1
    login-global-capacity: 60
    login-global-refill-tokens: 5
    login-global-refill-period-seconds: 1
    deletion-email-capacity: 3
    deletion-email-window-seconds: 3600
    deletion-email-cooldown-seconds: 30
    deletion-client-capacity: 10
    deletion-client-window-seconds: 3600
    deletion-global-capacity: 100
    deletion-global-window-seconds: 3600
    media-user-bytes: 524288000
    media-user-items: 1000
    media-upload-capacity: 20
    media-upload-refill-seconds: 3
  monitoring:
    enabled: ${MONITORING_ENABLED:false}
    username: ${MONITORING_USERNAME:}
    password: ${MONITORING_PASSWORD:}
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    hmac-secret: ${PASSWORD_RESET_HMAC_SECRET:}
    token-secret: ${PASSWORD_RESET_TOKEN_SECRET:}
    mail:
      host: ${PASSWORD_RESET_SMTP_HOST:smtp.gmail.com}
      port: ${PASSWORD_RESET_SMTP_PORT:587}
      username: ${PASSWORD_RESET_SMTP_USERNAME:}
      password: ${PASSWORD_RESET_SMTP_PASSWORD:}
      from: ${PASSWORD_RESET_SMTP_FROM:}
  support:
    mail:
      enabled: ${SUPPORT_MAIL_ENABLED:false}
      scheduler-enabled: true
      host: smtp.gmail.com
      port: 587
      username: ${SUPPORT_MAIL_USERNAME:}
      password: ${SUPPORT_MAIL_PASSWORD:}
      recipient: ${SUPPORT_MAIL_RECIPIENT:}
      sender-name: 포마펫 고객지원
  account-deletion:
    kakao-admin-key: ${KAKAO_ADMIN_KEY:}
    interval-ms: 30000
    scheduler-enabled: true
  media:
    cleanup-interval-ms: 30000
  firebase:
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
  notification:
    interval-ms: 60000
    lookback-minutes: 5
    timezone: Asia/Seoul
    scheduler-enabled: true
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000    # 30분 (ms)
    refresh-token-expiration: 2592000000 # 30일 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.formypet: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

management:
  endpoints:
    enabled-by-default: false
    web:
      discovery:
        enabled: false
      exposure:
        include: prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    prometheus:
      enabled: ${MONITORING_ENABLED:false}
  prometheus:
    metrics:
      export:
        enabled: ${MONITORING_ENABLED:false}
  metrics:
    # Explicit budget: do not export client URLs, disk paths or security internals.
    enable:
      all: false
      application: true
      http.server.requests: true
      jvm: true
      process: true
      system: true
      jdbc: true
      hikaricp: true
    tags:
      service: formypet
      environment: ${MONITORING_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: false
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s

---
spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

app:
  firebase:
    credentials-path: build/test-no-firebase-credentials.json
  support:
    mail:
      enabled: false
      scheduler-enabled: false
  account-deletion:
    scheduler-enabled: false
