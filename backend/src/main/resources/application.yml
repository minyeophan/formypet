spring:
  application:
    name: formypet

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/formypet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:formypet}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  notification:
    interval-ms: 60000
    lookback-minutes: 1
    timezone: Asia/Seoul
    scheduler-enabled: true
  jwt:
    secret: "${JWT_SECRET}"
    access-token-expiration: 1800000    # 30분 (ms)
    refresh-token-expiration: 2592000000 # 30일 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.formypet: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none
