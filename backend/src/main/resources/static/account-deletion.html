<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>포마펫 계정 삭제 요청</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;color:#202124;line-height:1.6}
    h1{font-size:1.8rem}label{display:block;margin:18px 0 6px;font-weight:600}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}
    button{margin-top:22px;padding:12px 18px;border:0;border-radius:8px;background:#b3261e;color:white;font:inherit;font-weight:700}
    button:disabled{opacity:.55}#status{margin-top:18px;white-space:pre-wrap}
  </style>
</head>
<body>
  <main>
    <h1>포마펫 계정 삭제 요청</h1>
    <p>앱에 로그인할 수 없는 경우 계정 삭제를 요청할 수 있습니다. 요청자의 본인 여부를 확인한 후 처리하며, 계정과 연결된 데이터 및 작성 콘텐츠를 삭제합니다. 법령상 보관 의무가 확인된 정보는 해당 근거와 기간을 안내합니다.</p>
    <p>요청을 보내면 운영 담당자가 입력한 이메일로 확인을 요청합니다. 카카오 계정은 서비스 계정 확인을 위해 카카오 닉네임 등 계정 확인 정보를 적어 주세요.</p>
    <form id="request-form">
      <label for="contactEmail">회신 받을 이메일</label>
      <input id="contactEmail" type="email" maxlength="254" autocomplete="email" required>
      <label for="accountIdentifier">포마펫 계정 확인 정보</label>
      <input id="accountIdentifier" maxlength="254" placeholder="가입 이메일 또는 카카오 닉네임" required>
      <button id="submit" type="submit">삭제 요청 보내기</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form=document.querySelector('#request-form'), button=document.querySelector('#submit'), status=document.querySelector('#status');
    form.addEventListener('submit',async event=>{
      event.preventDefault();button.disabled=true;status.textContent='요청을 보내고 있어요.';
      const requestId=crypto.randomUUID();
      try{
        const response=await fetch('/api/v1/public/account-deletion-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contactEmail:document.querySelector('#contactEmail').value.trim(),accountIdentifier:document.querySelector('#accountIdentifier').value.trim(),requestId})});
        const body=await response.json();
        if(!response.ok)throw new Error(body.detail||'요청을 접수하지 못했어요. 잠시 후 다시 시도해 주세요.');
        status.textContent='요청을 접수했습니다. 계정 본인 여부를 확인한 뒤 처리하고, 완료되면 입력한 이메일로 안내합니다. 요청 번호: '+body.data.requestId;
        form.reset();
      }catch(error){status.textContent=error.message||'요청을 접수하지 못했어요. 잠시 후 다시 시도해 주세요.';}
      finally{button.disabled=false;}
    });
  </script>
</body>
</html>
