plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.formypet'
version = '0.0.1-SNAPSHOT'

ext['jackson-bom.version'] = '2.18.11'
ext['tomcat.version'] = '10.1.60'
// Pin the resolved transitive runtime libraries to OSV-fixed versions.
ext['commons-lang3.version'] = '3.18.0'
ext['httpclient5.version'] = '5.6.4'
ext['httpcore5.version'] = '5.4.3'
ext['log4j2.version'] = '2.25.5'
ext['netty.version'] = '4.1.138.Final'
ext['opentelemetry.version'] = '1.62.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform('io.grpc:grpc-bom:1.75.0')
    implementation 'software.amazon.awssdk:s3'
    // ── Core ──────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // ── Database ──────────────────────────────────────────
    runtimeOnly  'com.mysql:mysql-connector-j:8.4.0'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'com.google.firebase:firebase-admin:9.5.0'

    // ── API Docs ──────────────────────────────────────────
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // ── Util ──────────────────────────────────────────────
    compileOnly    'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── Test ──────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'com.github.docker-java:docker-java-core:3.7.0'
    testImplementation 'com.github.docker-java:docker-java-transport-httpclient5:3.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:2.0.5"
        mavenBom "software.amazon.awssdk:bom:2.55.7"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', providers.gradleProperty('testTimezone').getOrElse('UTC')
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    maxParallelForks = 1

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        systemProperty 'docker.client.strategy', 'com.formypet.support.LocalDockerClientStrategy'
    }
}
