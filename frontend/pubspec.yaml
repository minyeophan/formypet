name: frontend
description: "petyilgi - 반려동물 케어 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  dio: ^5.7.0

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.12
  cached_network_image: ^3.4.1

  # Device
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1

  # Utils
  intl: ^0.19.0
  logger: ^2.4.0

  #kakao
  kakao_flutter_sdk_user: ^2.0.0+1 # 카카오 로그인 API 패키지

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
