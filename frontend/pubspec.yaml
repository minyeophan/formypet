name: frontend
description: "formypet - 반려동물 케어 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  dio: ^5.7.0

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.12
  cached_network_image: ^3.4.1

  # Device
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0

  # Utils
  intl: ^0.19.0
  logger: ^2.4.0

  #kakao
  kakao_flutter_sdk_user: ^2.0.0+1 # 카카오 로그인 API 패키지

dev_dependencies:
  integration_test:
    sdk: flutter
  firebase_core_platform_interface: ^6.0.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
      - assets/images/
      - assets/icons/
      - assets/illustrations/
      - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 100
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 200
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 300
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 700
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 800
        - asset: assets/fonts/NotoSansKR-Variable.ttf
          weight: 900
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
