name: ForMyPet CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run backend tests
        run: bash ./gradlew test --no-daemon
